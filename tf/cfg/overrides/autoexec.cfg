// Aliases
  // Attack
    alias "+atk1" "+attack"
    alias "+atk2" "+attack2"
    alias "+atk3" "+attack3"
    alias "+atka" "+attack;+attack2;+attack3"
    alias "-atk1" "-attack"
    alias "-atk2" "-attack2"
    alias "-atk3" "-attack3"
    alias "-atka" "-attack;-attack2;-attack3"
    
  // Crouch-jump with precise additions
    alias +rj "spec_mode;-duck;+cr;alias checkrj +cr";
    alias -rj "-cr;checkduck;alias checkrj none";
    alias +crouch "-cr;+duck;alias checkduck +duck";
    alias -crouch "-duck;checkrj;alias checkduck none";
    alias checkduck none;
    alias checkrj none;
    alias +cr "+jump;+duck";
    alias -cr "-duck;-jump";
    alias none "";
    
  // Force engine refresh
    alias "fullrefresh" "hud_reloadscheme;snd_restart;record fix;stop;clear"
    
  // Clear the log for performance, instead adds overhead
    //alias "clrit" "clear;wait 10000;clrit"
    //clrit
    
  // Advanced game info
    alias +scoresadv "+showscores; net_graph 1; developer 1; cl_showfps 1"
    alias -scoresadv "-showscores; net_graph 0; developer 0; cl_showfps 0"
    
  // Toggled Attack
    alias +tgatk1 "+atk1; play indicate/ontgatk1.wav; bind mouse1 -tgatk1"
    alias -tgatk1 "-atk1; play indicate/offtgatk1.wav; bind mouse1 +tgatk1"
    alias +tgatk2 "+atk2; play indicate/ontgatk2.wav; bind mouse2 -tgatk2"
    alias -tgatk2 "-atk2; play indicate/offtgatk2.wav; bind mouse2 +tgatk2"
    alias +tgatk3 "+atk3; play indicate/ontgatk3.wav; bind mouse3 -tgatk3"
    alias -tgatk3 "-atk3; play indicate/offtgatk3.wav; bind mouse3 +tgatk3"

// Permanent Binds
  bind "K" "kill;explode; play selfkill.wav"
  bind "E" "voicemenu 0 0; wait 650; voicemenu 2 0"
  bind "W" "+mf"
  bind "A" "+ml"
  bind "S" "+mb"
  bind "D" "+mr"
  bind space +rj;
  bind ctrl +crouch;

// Tweaks
  tf_use_min_viewmodels 1
  tf_viewmodels_offset_override 0 0 10
  viewmodel_fov 40
  fov_desired 90
  cl_hud_playerclass_use_playermodel 0
  m_filter 0
  tf_colorblindassist 1
 
